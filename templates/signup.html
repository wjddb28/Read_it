
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 | Read-it</title>
    <link rel="stylesheet" href="static/css/auth.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-box">
            <a href="index.html" class="logo">Read-it<span>.</span></a>
            <h1>회원가입</h1>

            <form class="auth-form" action="/signup" method="post">
                <div class="field">
                    <label for="username">아이디</label>
                    <div class="row">
                        <input id="username" name="username" type="text"
                               placeholder="아이디를 입력하세요" required>
                        <button class="check-btn" type="button">중복 확인</button>
                    </div>
                </div>

                <div class="field">
                    <label for="nickname">닉네임</label>
                    <div class="row">
                        <input id="nickname" name="nickname" type="text"
                               placeholder="닉네임을 입력하세요" required>
                        <button class="check-btn" type="button">중복 확인</button>
                    </div>
                </div>

                <div class="field">
                    <label for="password">비밀번호</label>
                    <input id="password" name="password" type="password"
                           placeholder="비밀번호를 입력하세요" required>
                </div>

                <div class="field">
                    <label for="password_confirm">비밀번호 확인</label>
                    <input id="password_confirm" name="password_confirm" type="password"
                           placeholder="비밀번호를 다시 입력하세요" required>
                </div>

                <button class="submit-btn" type="submit">회원가입</button>
            </form>

            <p class="switch">
                이미 계정이 있나요?
                <a href="login.html">로그인</a>
            </p>
        </section>
    </main>
</body>
</html>
